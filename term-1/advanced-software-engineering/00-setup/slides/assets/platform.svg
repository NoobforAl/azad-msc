<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" font-family="Inter, Vazirmatn, sans-serif" direction="ltr">
  <!-- Roles (Advanced Software Engineering): client=teal #0E7490, service=amber #B45309, infrastructure=violet #6D28D9, store=green #047857 -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4868"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="30" y="250" width="270" height="140" rx="16" fill="#DFF4F8" stroke="#0E7490" stroke-width="3"/>
  <text x="56" y="306" font-size="30" font-weight="700" fill="#0E7490">Client</text>
  <text x="56" y="352" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">web / CLI / curl</text>

  <!-- registration-api (exists in m0) -->
  <rect x="440" y="250" width="320" height="140" rx="16" fill="#FDEFD9" stroke="#B45309" stroke-width="5"/>
  <text x="466" y="306" font-size="30" font-weight="700" fill="#B45309">registration-api</text>
  <text x="466" y="352" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">Go 1.22 · m0</text>

  <!-- Message broker (planned) -->
  <rect x="900" y="50" width="320" height="140" rx="16" fill="#EEE6FB" stroke="#6D28D9" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="926" y="106" font-size="30" font-weight="700" fill="#6D28D9">Message broker</text>
  <text x="926" y="152" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">planned · module 04</text>

  <!-- PostgreSQL (planned) -->
  <rect x="900" y="450" width="320" height="140" rx="16" fill="#DCF3EA" stroke="#047857" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="926" y="506" font-size="30" font-weight="700" fill="#047857">PostgreSQL</text>
  <text x="926" y="552" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">planned · module 04</text>

  <!-- analytics (stub exists in m0, not yet connected) -->
  <rect x="1270" y="250" width="300" height="140" rx="16" fill="#FDEFD9" stroke="#B45309" stroke-width="5"/>
  <text x="1296" y="306" font-size="30" font-weight="700" fill="#B45309">analytics</text>
  <text x="1296" y="352" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">Python 3.8+ · stub</text>

  <!-- arrows: solid = exists in m0, dashed = planned -->
  <path d="M300 320 L432 320" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <text x="312" y="300" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">HTTP</text>
  <path d="M700 250 C760 160, 800 130, 892 120" stroke="#3B4868" stroke-width="4" fill="none" stroke-dasharray="12 10" marker-end="url(#ah)"/>
  <text x="640" y="170" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">events</text>
  <path d="M700 390 C760 480, 800 510, 892 520" stroke="#3B4868" stroke-width="4" fill="none" stroke-dasharray="12 10" marker-end="url(#ah)"/>
  <text x="640" y="480" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">SQL</text>
  <path d="M1220 120 C1300 130, 1380 170, 1400 242" stroke="#3B4868" stroke-width="4" fill="none" stroke-dasharray="12 10" marker-end="url(#ah)"/>
  <text x="1330" y="150" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">events</text>
  <path d="M1400 398 C1380 470, 1300 515, 1228 520" stroke="#3B4868" stroke-width="4" fill="none" stroke-dasharray="12 10" marker-end="url(#ah)"/>
  <text x="1440" y="470" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">reads</text>

  <!-- numbered callouts -->
  <circle cx="60" cy="236" r="26" fill="#2F4BB0"/><text x="60" y="246" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="470" cy="236" r="26" fill="#2F4BB0"/><text x="470" y="246" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="930" cy="36" r="26" fill="#2F4BB0"/><text x="930" y="46" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>

  <!-- legend -->
  <line x1="40" y1="590" x2="120" y2="590" stroke="#0A1633" stroke-width="5"/>
  <text x="136" y="600" font-size="26" fill="#0A1633">exists in m0</text>
  <line x1="400" y1="590" x2="480" y2="590" stroke="#0A1633" stroke-width="4" stroke-dasharray="12 10"/>
  <text x="496" y="600" font-size="26" fill="#0A1633">planned</text>
</svg>
