<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 530" font-family="Inter, Vazirmatn, sans-serif" direction="ltr">
  <!-- Roles: source text = store (green), renderer = infrastructure (violet), picture = client (teal) -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4868"/>
    </marker>
  </defs>

  <!-- column headings -->
  <text x="30" y="40" font-size="26" font-weight="700" fill="#047857">source (committed)</text>
  <text x="440" y="40" font-size="26" font-weight="700" fill="#6D28D9">renderer</text>
  <text x="850" y="40" font-size="26" font-weight="700" fill="#6D28D9">renderer 2</text>
  <text x="1260" y="40" font-size="26" font-weight="700" fill="#0E7490">picture (committed)</text>

  <!-- row 1: Mermaid -->
  <rect x="30" y="70" width="340" height="110" rx="16" fill="#DCF3EA" stroke="#047857" stroke-width="3"/>
  <text x="52" y="136" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">overview.mmd</text>
  <rect x="440" y="70" width="340" height="110" rx="16" fill="#EEE6FB" stroke="#6D28D9" stroke-width="3"/>
  <text x="462" y="136" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">mermaid-cli</text>
  <rect x="1260" y="70" width="310" height="110" rx="16" fill="#DFF4F8" stroke="#0E7490" stroke-width="3"/>
  <text x="1282" y="136" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">overview.svg</text>
  <path d="M370 125 L432 125" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M780 125 L1252 125" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>

  <!-- row 2: PlantUML -->
  <rect x="30" y="230" width="340" height="110" rx="16" fill="#DCF3EA" stroke="#047857" stroke-width="3"/>
  <text x="52" y="296" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">list-courses.puml</text>
  <rect x="440" y="230" width="340" height="110" rx="16" fill="#EEE6FB" stroke="#6D28D9" stroke-width="3"/>
  <text x="462" y="296" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">plantuml (Docker)</text>
  <rect x="1260" y="230" width="310" height="110" rx="16" fill="#DFF4F8" stroke="#0E7490" stroke-width="3"/>
  <text x="1282" y="296" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">list-courses.svg</text>
  <path d="M370 285 L432 285" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M780 285 L1252 285" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>

  <!-- row 3: Structurizr -->
  <rect x="30" y="390" width="340" height="110" rx="16" fill="#DCF3EA" stroke="#047857" stroke-width="3"/>
  <text x="52" y="456" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">workspace.dsl</text>
  <rect x="440" y="390" width="340" height="110" rx="16" fill="#EEE6FB" stroke="#6D28D9" stroke-width="3"/>
  <text x="462" y="446" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">structurizr export</text>
  <text x="462" y="480" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">(Docker) → c4/*.mmd</text>
  <rect x="850" y="390" width="340" height="110" rx="16" fill="#EEE6FB" stroke="#6D28D9" stroke-width="3"/>
  <text x="872" y="456" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">mermaid-cli</text>
  <rect x="1260" y="390" width="310" height="110" rx="16" fill="#DFF4F8" stroke="#0E7490" stroke-width="3"/>
  <text x="1282" y="446" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">c4-context.svg</text>
  <text x="1282" y="480" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">c4-containers.svg</text>
  <path d="M370 445 L432 445" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M780 445 L842 445" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M1190 445 L1252 445" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>

  <!-- callouts -->
  <circle cx="400" cy="80" r="26" fill="#2F4BB0"/><text x="400" y="90" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="400" cy="240" r="26" fill="#2F4BB0"/><text x="400" y="250" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="400" cy="400" r="26" fill="#2F4BB0"/><text x="400" y="410" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>

</svg>
