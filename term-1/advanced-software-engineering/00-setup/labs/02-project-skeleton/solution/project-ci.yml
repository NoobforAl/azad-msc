# Extension solution: project-ci.yml plus a formatting gate (needs the fmt-check target from fmt-check.mk).
name: project-ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: make lint
      - run: make test
      - run: make fmt-check
