# Lint settings for the Python in project/ (analytics service). Same rule set as the course repository's ruff.toml,
# so `make lint` gives the same answer inside the course repo and in your own copy.
line-length = 120
target-version = "py38"          # the course documents Python >= 3.8

[lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]                # line length is handled by the formatter
