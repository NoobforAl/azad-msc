# CI for your own copy of project/ (the repository root is the project). Same commands as `make check`.
# The template ci/github-actions.yml inside the course repository adds `paths:` and `working-directory:`
# because there the project lives in a sub-folder; here both are removed.
name: project-ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: make lint
      - run: make test
