<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" font-family="Inter, Vazirmatn, sans-serif" direction="ltr">
  <!-- Schach 8e, ch. 2 §2.5: iterative-and-incremental model. Rows = workflows, columns = builds (increments). -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4868"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F5B301"/>
    </marker>
  </defs>

  <!-- column headers: increments -->
  <text x="590" y="44" font-size="28" font-weight="700" fill="#2F4BB0" text-anchor="middle">Build 1</text>
  <text x="960" y="44" font-size="28" font-weight="700" fill="#2F4BB0" text-anchor="middle">Build 2</text>
  <text x="1330" y="44" font-size="28" font-weight="700" fill="#2F4BB0" text-anchor="middle">Build 3</text>
  <path d="M470 60 L1450 60" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>

  <!-- row labels (workflows) -->
  <g font-size="28" font-weight="700" fill="#0A1633">
    <text x="30" y="142">Requirements</text>
    <text x="30" y="242">Analysis</text>
    <text x="30" y="342">Design</text>
    <text x="30" y="442">Implementation</text>
    <text x="30" y="542">Test</text>
  </g>

  <!-- cells: 5 rows x 3 builds; artifacts get a new version (iteration), implementation adds a feature (incrementation) -->
  <g fill="#F4F6FC" stroke="#8392C3" stroke-width="3">
    <rect x="440" y="100" width="300" height="64" rx="12"/><rect x="810" y="100" width="300" height="64" rx="12"/><rect x="1180" y="100" width="300" height="64" rx="12"/>
    <rect x="440" y="200" width="300" height="64" rx="12"/><rect x="810" y="200" width="300" height="64" rx="12"/><rect x="1180" y="200" width="300" height="64" rx="12"/>
    <rect x="440" y="300" width="300" height="64" rx="12"/><rect x="810" y="300" width="300" height="64" rx="12"/><rect x="1180" y="300" width="300" height="64" rx="12"/>
    <rect x="440" y="400" width="300" height="64" rx="12"/><rect x="810" y="400" width="300" height="64" rx="12"/><rect x="1180" y="400" width="300" height="64" rx="12"/>
    <rect x="440" y="500" width="300" height="64" rx="12"/><rect x="810" y="500" width="300" height="64" rx="12"/><rect x="1180" y="500" width="300" height="64" rx="12"/>
  </g>
  <g font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633" text-anchor="middle">
    <text x="590" y="141">reqs v1</text><text x="960" y="141">reqs v2</text><text x="1330" y="141">reqs v3</text>
    <text x="590" y="241">model v1</text><text x="960" y="241">model v2</text><text x="1330" y="241">model v3</text>
    <text x="590" y="341">design v1</text><text x="960" y="341">design v2</text><text x="1330" y="341">design v3</text>
    <text x="590" y="441">+ feature A</text><text x="960" y="441">+ feature B</text><text x="1330" y="441">+ feature C</text>
    <text x="590" y="541">tests A</text><text x="960" y="541">tests A+B</text><text x="1330" y="541">tests A+B+C</text>
  </g>

  <!-- iteration: thick accent arrows inside the Design row (the same artifact gets better) -->
  <path d="M740 332 L802 332" stroke="#F5B301" stroke-width="8" fill="none" marker-end="url(#ahg)"/>
  <path d="M1110 332 L1172 332" stroke="#F5B301" stroke-width="8" fill="none" marker-end="url(#ahg)"/>

  <!-- numbered callouts -->
  <circle cx="440" cy="44" r="26" fill="#2F4BB0"/><text x="440" y="54" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="775" cy="300" r="26" fill="#2F4BB0"/><text x="775" y="310" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="440" cy="400" r="26" fill="#2F4BB0"/><text x="440" y="410" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
</svg>
