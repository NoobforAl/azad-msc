<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" font-family="Inter, Vazirmatn, sans-serif" direction="ltr">
  <!-- Space-time diagram. Each event: Lamport L and vector V. Computed with the rules of clocks.go. -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4868"/>
    </marker>
  </defs>
  <text x="20" y="108" font-size="32" font-weight="700" fill="#0E7490">P0</text>
  <text x="20" y="308" font-size="32" font-weight="700" fill="#0E7490">P1</text>
  <text x="20" y="508" font-size="32" font-weight="700" fill="#0E7490">P2</text>
  <line x1="90" y1="98" x2="1580" y2="98" stroke="#0E7490" stroke-width="4"/>
  <line x1="90" y1="298" x2="1580" y2="298" stroke="#0E7490" stroke-width="4"/>
  <line x1="90" y1="498" x2="1580" y2="498" stroke="#0E7490" stroke-width="4"/>

  <!-- messages -->
  <line x1="460" y1="104" x2="760" y2="290" stroke="#3B4868" stroke-width="4" marker-end="url(#ah)"/>
  <text x="500" y="220" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">m1</text>
  <line x1="1060" y1="304" x2="1360" y2="490" stroke="#3B4868" stroke-width="4" marker-end="url(#ah)"/>
  <text x="1110" y="420" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">m2</text>

  <!-- P0 events -->
  <circle cx="200" cy="98" r="14" fill="#F5B301" stroke="#9A4A00" stroke-width="3"/>
  <text x="170" y="64" font-size="26" font-weight="700" fill="#0A1633">a</text>
  <text x="140" y="150" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">L1 [1,0,0]</text>
  <circle cx="460" cy="98" r="14" fill="#1F4FA8"/>
  <text x="430" y="64" font-size="26" font-weight="700" fill="#0A1633">b send</text>
  <text x="330" y="150" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">L2 [2,0,0]</text>

  <!-- P1 events -->
  <circle cx="300" cy="298" r="14" fill="#1F4FA8"/>
  <text x="285" y="264" font-size="26" font-weight="700" fill="#0A1633">c</text>
  <text x="200" y="350" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">L1 [0,1,0]</text>
  <circle cx="770" cy="298" r="14" fill="#1F4FA8"/>
  <text x="790" y="264" font-size="26" font-weight="700" fill="#0A1633">d recv</text>
  <text x="680" y="350" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">L3 [2,2,0]</text>
  <circle cx="1060" cy="298" r="14" fill="#1F4FA8"/>
  <text x="1030" y="264" font-size="26" font-weight="700" fill="#0A1633">e send</text>
  <text x="960" y="350" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">L4 [2,3,0]</text>

  <!-- P2 events -->
  <circle cx="250" cy="498" r="14" fill="#1F4FA8"/>
  <text x="240" y="464" font-size="26" font-weight="700" fill="#0A1633">f</text>
  <text x="160" y="550" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">L1 [0,0,1]</text>
  <circle cx="620" cy="498" r="14" fill="#F5B301" stroke="#9A4A00" stroke-width="3"/>
  <text x="610" y="464" font-size="26" font-weight="700" fill="#0A1633">g</text>
  <text x="530" y="550" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">L2 [0,0,2]</text>
  <circle cx="1370" cy="498" r="14" fill="#1F4FA8"/>
  <text x="1395" y="464" font-size="26" font-weight="700" fill="#0A1633">h recv</text>
  <text x="1280" y="550" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">L5 [2,3,3]</text>

  <!-- callout: a || g although L(a) < L(g) -->
  <rect x="700" y="400" width="400" height="60" rx="12" fill="#FFF1C2" stroke="#9A4A00" stroke-width="3"/>
  <text x="720" y="440" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">L(a)&lt;L(g) but a ∥ g</text>
</svg>
