<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" font-family="Inter, Vazirmatn, sans-serif" direction="ltr">
  <!-- Roles (Advanced OS): user=teal #0E7490, kernel=amber #B45309, hardware=violet #6D28D9, data=green #047857 -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4868"/>
    </marker>
  </defs>
  <!-- actors -->
  <rect x="80" y="10" width="300" height="70" rx="14" fill="#DFF4F8" stroke="#0E7490" stroke-width="3"/>
  <text x="230" y="56" text-anchor="middle" font-size="30" font-weight="700" fill="#0E7490">Client</text>
  <rect x="1060" y="10" width="300" height="70" rx="14" fill="#DCF3EA" stroke="#047857" stroke-width="3"/>
  <text x="1210" y="56" text-anchor="middle" font-size="30" font-weight="700" fill="#047857">Server</text>
  <line x1="230" y1="80" x2="230" y2="630" stroke="#8C9DBF" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="1210" y1="80" x2="1210" y2="630" stroke="#8C9DBF" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- 1 request -->
  <line x1="232" y1="120" x2="1200" y2="160" stroke="#3B4868" stroke-width="4" marker-end="url(#ah)"/>
  <circle cx="300" cy="104" r="22" fill="#1F4FA8"/><text x="300" y="113" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">1</text>
  <text x="340" y="112" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">Deposit(id=dep-7, +10)</text>
  <rect x="1230" y="140" width="330" height="50" rx="12" fill="#DCF3EA" stroke="#047857" stroke-width="3"/>
  <text x="1395" y="174" text-anchor="middle" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">balance += 10</text>

  <!-- 2 lost reply -->
  <line x1="1200" y1="210" x2="760" y2="236" stroke="#3B4868" stroke-width="4" stroke-dasharray="12 10"/>
  <text x="740" y="250" font-size="44" font-weight="800" fill="#B4123A">✕</text>
  <circle cx="1130" cy="190" r="22" fill="#1F4FA8"/><text x="1130" y="199" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">2</text>
  <text x="800" y="290" font-size="26" fill="#0A1633">reply late / lost</text>

  <!-- 3 timeout -->
  <rect x="60" y="300" width="340" height="50" rx="12" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="230" y="334" text-anchor="middle" font-size="26" fill="#0A1633">timeout 200 ms</text>
  <circle cx="30" cy="325" r="22" fill="#1F4FA8"/><text x="30" y="334" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">3</text>

  <!-- 4 retry -->
  <line x1="232" y1="380" x2="1200" y2="420" stroke="#3B4868" stroke-width="4" marker-end="url(#ah)"/>
  <circle cx="300" cy="364" r="22" fill="#1F4FA8"/><text x="300" y="373" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">4</text>
  <text x="340" y="372" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">retry: same id=dep-7</text>

  <!-- branches -->
  <rect x="1230" y="420" width="350" height="76" rx="12" fill="#FDE4EA" stroke="#B4123A" stroke-width="3"/>
  <text x="1250" y="452" font-size="24" font-weight="700" fill="#B4123A">BUG · no dedup</text>
  <text x="1250" y="484" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">+10 again</text>
  <rect x="1230" y="510" width="350" height="76" rx="12" fill="#DDF3E4" stroke="#12733A" stroke-width="3"/>
  <text x="1250" y="542" font-size="24" font-weight="700" fill="#12733A">FIX · reply cache</text>
  <text x="1250" y="574" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">replay old reply</text>

  <!-- 5 reply -->
  <line x1="1200" y1="600" x2="240" y2="616" stroke="#3B4868" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#ah)"/>
  <circle cx="1130" cy="580" r="22" fill="#1F4FA8"/><text x="1130" y="589" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">5</text>
</svg>
