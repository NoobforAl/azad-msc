<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" font-family="Inter, Vazirmatn, sans-serif" direction="ltr">
  <!-- Roles: user=teal #0E7490, kernel=amber #B45309, data=green #047857 -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4868"/>
    </marker>
  </defs>

  <!-- User space -->
  <rect x="20" y="20" width="1560" height="250" rx="28" fill="#FFFFFF" stroke="#0E7490" stroke-width="3"/>
  <text x="50" y="66" font-size="30" font-weight="750" fill="#0E7490">user space</text>
  <rect x="50" y="96" width="420" height="140" rx="14" fill="#DFF4F8" stroke="#0E7490" stroke-width="3"/>
  <text x="76" y="140" font-size="26" font-weight="700" fill="#0E7490">① lock()</text>
  <text x="76" y="184" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">cmpxchg 0 → 1</text>
  <text x="76" y="220" font-size="24" fill="#0A1633">success: no syscall</text>
  <rect x="590" y="96" width="420" height="140" rx="14" fill="#DCF3EA" stroke="#047857" stroke-width="3"/>
  <text x="616" y="140" font-size="26" font-weight="700" fill="#047857">futex word (u32)</text>
  <text x="616" y="190" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">0 free · 1 held</text>
  <text x="616" y="224" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">2 held + waiters</text>
  <rect x="1130" y="96" width="420" height="140" rx="14" fill="#DFF4F8" stroke="#0E7490" stroke-width="3"/>
  <text x="1156" y="140" font-size="26" font-weight="700" fill="#0E7490">④ unlock()</text>
  <text x="1156" y="184" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">fetch_sub: was 1?</text>
  <text x="1156" y="220" font-size="24" fill="#0A1633">yes: done, no syscall</text>
  <line x1="470" y1="166" x2="586" y2="166" stroke="#3B4868" stroke-width="4" marker-end="url(#ah)"/>
  <line x1="1126" y1="166" x2="1014" y2="166" stroke="#3B4868" stroke-width="4" marker-end="url(#ah)"/>

  <!-- Boundary -->
  <line x1="20" y1="320" x2="1580" y2="320" stroke="#1F4FA8" stroke-width="4" stroke-dasharray="16 12"/>
  <rect x="1240" y="300" width="320" height="40" fill="#FFFFFF"/>
  <text x="1256" y="330" font-size="24" font-weight="700" fill="#1F4FA8">syscall boundary</text>

  <!-- Kernel -->
  <rect x="20" y="370" width="1560" height="250" rx="28" fill="#FFFFFF" stroke="#B45309" stroke-width="3"/>
  <text x="50" y="416" font-size="30" font-weight="750" fill="#B45309">kernel</text>
  <rect x="50" y="446" width="640" height="150" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="76" y="490" font-size="26" font-weight="700" fill="#B45309">② futex_wait_setup()</text>
  <text x="76" y="534" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">lock hb; *uaddr == val ?</text>
  <text x="76" y="572" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">queue; schedule()</text>
  <rect x="910" y="446" width="640" height="150" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="936" y="490" font-size="26" font-weight="700" fill="#B45309">⑤ futex_wake()</text>
  <text x="936" y="534" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">waiters? lock hb</text>
  <text x="936" y="572" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">wake 1; unlock</text>

  <!-- Slow path arrows -->
  <path d="M260 236 L260 442" stroke="#F5B301" stroke-width="8" fill="none" marker-end="url(#ah)"/>
  <text x="280" y="300" font-size="24" font-weight="700" fill="#0A1633">③ fail: xchg 2, FUTEX_WAIT</text>
  <path d="M1340 236 L1340 442" stroke="#F5B301" stroke-width="8" fill="none" marker-end="url(#ah)"/>
  <text x="1010" y="300" font-size="24" font-weight="700" fill="#0A1633">was 2: FUTEX_WAKE</text>
  <path d="M906 520 L694 520" stroke="#3B4868" stroke-width="4" stroke-dasharray="12 10" fill="none" marker-end="url(#ah)"/>
  <text x="730" y="510" font-size="22" font-weight="700" fill="#0A1633">wake</text>
</svg>
