<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" font-family="Inter, Vazirmatn, sans-serif" direction="ltr">
  <!-- Where seccomp and Landlock decide, on one openat() call.
       Roles: user = teal, kernel = amber, data/object = green; deny = danger with a text label. -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4868"/>
    </marker>
  </defs>

  <!-- User process -->
  <rect x="20" y="20" width="1560" height="120" rx="14" fill="#DFF4F8" stroke="#0E7490" stroke-width="3"/>
  <text x="50" y="68" font-size="30" font-weight="700" fill="#0E7490">user process</text>
  <text x="50" y="112" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">prctl(NO_NEW_PRIVS) · seccomp(filter) · landlock_restrict_self() · openat("/tmp/b")</text>

  <!-- syscall boundary -->
  <line x1="20" y1="180" x2="1580" y2="180" stroke="#1F4FA8" stroke-width="4" stroke-dasharray="16 12"/>
  <rect x="1250" y="164" width="300" height="32" fill="#FFFFFF"/>
  <text x="1400" y="190" font-size="24" font-weight="700" fill="#1F4FA8" text-anchor="middle">syscall boundary</text>

  <!-- ① seccomp -->
  <rect x="20" y="230" width="460" height="150" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="50" y="276" font-size="28" font-weight="700" fill="#B45309">① seccomp</text>
  <text x="50" y="318" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">syscall_trace_enter()</text>
  <text x="50" y="352" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">seccomp_run_filters()</text>

  <!-- ② path lookup -->
  <rect x="570" y="230" width="460" height="150" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="600" y="276" font-size="28" font-weight="700" fill="#B45309">② do_sys_openat2()</text>
  <text x="600" y="318" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">path lookup → dentry</text>
  <text x="600" y="352" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">struct file</text>

  <!-- ③ LSM / Landlock -->
  <rect x="1120" y="230" width="460" height="150" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="1150" y="276" font-size="28" font-weight="700" fill="#B45309">③ LSM: Landlock</text>
  <text x="1150" y="318" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">security_file_open()</text>
  <text x="1150" y="352" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">hook_file_open()</text>

  <!-- arrows -->
  <line x1="250" y1="140" x2="250" y2="226" stroke="#3B4868" stroke-width="4" marker-end="url(#ah)"/>
  <line x1="480" y1="305" x2="566" y2="305" stroke="#3B4868" stroke-width="4" marker-end="url(#ah)"/>
  <text x="525" y="340" font-size="20" font-weight="700" fill="#3B4868" text-anchor="middle">ALLOW</text>
  <line x1="1030" y1="305" x2="1116" y2="305" stroke="#3B4868" stroke-width="4" marker-end="url(#ah)"/>

  <!-- outcomes -->
  <rect x="20" y="440" width="460" height="150" rx="14" fill="#FDE4EA" stroke="#B4123A" stroke-width="4"/>
  <text x="50" y="488" font-size="26" font-weight="700" fill="#B4123A">DENY before the syscall</text>
  <text x="50" y="528" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">ERRNO → -1, errno</text>
  <text x="50" y="562" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">KILL → SIGSYS</text>
  <line x1="250" y1="380" x2="250" y2="436" stroke="#3B4868" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#ah)"/>

  <rect x="570" y="440" width="460" height="150" rx="14" fill="#DCF3EA" stroke="#047857" stroke-width="3"/>
  <text x="600" y="488" font-size="26" font-weight="700" fill="#047857">sees objects</text>
  <text x="600" y="528" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">resolved path, inode,</text>
  <text x="600" y="562" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">per-layer access masks</text>

  <rect x="1120" y="440" width="460" height="150" rx="14" fill="#FDE4EA" stroke="#B4123A" stroke-width="4"/>
  <text x="1150" y="488" font-size="26" font-weight="700" fill="#B4123A">DENY after lookup</text>
  <text x="1150" y="528" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">-EACCES</text>
  <text x="1150" y="562" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">"Permission denied"</text>
  <line x1="1350" y1="380" x2="1350" y2="436" stroke="#3B4868" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#ah)"/>
</svg>
