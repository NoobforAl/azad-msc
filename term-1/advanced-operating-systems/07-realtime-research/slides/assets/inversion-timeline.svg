<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" font-family="Inter, Vazirmatn, sans-serif" direction="ltr">
  <!-- Priority inversion, one CPU. Time axis 0..1100 ms -> x 200..1560 (1.236 px/ms).
       Roles (Advanced OS): user threads = teal #0E7490; boosted owner = amber #B45309 (kernel changed its prio);
       H blocked = dashed danger #B4123A. Labels are language-neutral (code / thread names). -->
  <defs>
    <pattern id="wait" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#FDE4EA"/><line x1="0" y1="0" x2="0" y2="16" stroke="#B4123A" stroke-width="4"/>
    </pattern>
  </defs>

  <!-- ===== Panel 1: no protocol ===== -->
  <text x="20" y="44" font-size="30" font-weight="750" fill="#0A1633">① PTHREAD_PRIO_NONE</text>
  <text x="120" y="102" font-size="28" font-weight="700" fill="#0A1633" text-anchor="end">H</text>
  <text x="120" y="162" font-size="28" font-weight="700" fill="#0A1633" text-anchor="end">M</text>
  <text x="120" y="222" font-size="28" font-weight="700" fill="#0A1633" text-anchor="end">L</text>
  <text x="140" y="102" font-size="22" fill="#3B4868">30</text>
  <text x="140" y="162" font-size="22" fill="#3B4868">20</text>
  <text x="140" y="222" font-size="22" fill="#3B4868">10</text>
  <!-- L 0-20 holds lock -->
  <rect x="200" y="196" width="25" height="36" rx="6" fill="#DFF4F8" stroke="#0E7490" stroke-width="3"/>
  <!-- H waits 21-1002 -->
  <rect x="226" y="76" width="1212" height="36" rx="6" fill="url(#wait)" stroke="#B4123A" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- M runs 22-822 -->
  <rect x="227" y="136" width="989" height="36" rx="6" fill="#DFF4F8" stroke="#0E7490" stroke-width="3"/>
  <text x="720" y="163" font-size="26" font-weight="700" fill="#0E7490" text-anchor="middle">M burns 800 ms</text>
  <!-- L resumes 822-1002 -->
  <rect x="1216" y="196" width="222" height="36" rx="6" fill="#DFF4F8" stroke="#0E7490" stroke-width="3"/>
  <!-- H runs -->
  <rect x="1438" y="76" width="14" height="36" rx="4" fill="#12733A"/>
  <text x="1460" y="102" font-size="24" font-weight="700" fill="#12733A">lock</text>

  <!-- ===== Panel 2: priority inheritance ===== -->
  <text x="20" y="344" font-size="30" font-weight="750" fill="#0A1633">② PTHREAD_PRIO_INHERIT</text>
  <text x="120" y="402" font-size="28" font-weight="700" fill="#0A1633" text-anchor="end">H</text>
  <text x="120" y="462" font-size="28" font-weight="700" fill="#0A1633" text-anchor="end">M</text>
  <text x="120" y="522" font-size="28" font-weight="700" fill="#0A1633" text-anchor="end">L</text>
  <text x="140" y="402" font-size="22" fill="#3B4868">30</text>
  <text x="140" y="462" font-size="22" fill="#3B4868">20</text>
  <text x="140" y="522" font-size="22" fill="#3B4868">10</text>
  <rect x="200" y="496" width="25" height="36" rx="6" fill="#DFF4F8" stroke="#0E7490" stroke-width="3"/>
  <!-- H waits 21-201 -->
  <rect x="226" y="376" width="222" height="36" rx="6" fill="url(#wait)" stroke="#B4123A" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- L boosted 21-201 -->
  <rect x="226" y="496" width="222" height="36" rx="6" fill="#FDEFD9" stroke="#B45309" stroke-width="4"/>
  <text x="462" y="523" font-size="24" font-weight="700" fill="#B45309">L boosted 10 → 30</text>
  <rect x="448" y="376" width="14" height="36" rx="4" fill="#12733A"/>
  <text x="470" y="402" font-size="24" font-weight="700" fill="#12733A">lock</text>
  <!-- M runs after 202 -->
  <rect x="462" y="436" width="989" height="36" rx="6" fill="#DFF4F8" stroke="#0E7490" stroke-width="3"/>
  <text x="956" y="463" font-size="26" font-weight="700" fill="#0E7490" text-anchor="middle">M runs after H</text>

  <!-- Time axis -->
  <line x1="200" y1="580" x2="1560" y2="580" stroke="#3B4868" stroke-width="3"/>
  <g font-size="22" fill="#3B4868" text-anchor="middle" font-family="JetBrains Mono, monospace">
    <line x1="200" y1="574" x2="200" y2="588" stroke="#3B4868" stroke-width="3"/><text x="200" y="614">0</text>
    <line x1="447" y1="574" x2="447" y2="588" stroke="#3B4868" stroke-width="3"/><text x="447" y="614">200</text>
    <line x1="694" y1="574" x2="694" y2="588" stroke="#3B4868" stroke-width="3"/><text x="694" y="614">400</text>
    <line x1="942" y1="574" x2="942" y2="588" stroke="#3B4868" stroke-width="3"/><text x="942" y="614">600</text>
    <line x1="1189" y1="574" x2="1189" y2="588" stroke="#3B4868" stroke-width="3"/><text x="1189" y="614">800</text>
    <line x1="1436" y1="574" x2="1436" y2="588" stroke="#3B4868" stroke-width="3"/><text x="1436" y="614">1000 ms</text>
  </g>
  <!-- Divider between panels -->
  <line x1="20" y1="290" x2="1580" y2="290" stroke="#9FB6E3" stroke-width="3"/>
</svg>
