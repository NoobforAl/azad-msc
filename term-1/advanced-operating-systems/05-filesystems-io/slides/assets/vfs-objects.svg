<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 640" font-family="Inter, Vazirmatn, sans-serif" direction="ltr">
  <!-- Roles (Advanced OS): user=teal #0E7490, kernel=amber #B45309, hardware=violet #6D28D9, data=green #047857 -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4868"/>
    </marker>
  </defs>
  <!-- user space -->
  <rect x="20" y="20" width="300" height="250" rx="14" fill="#DFF4F8" stroke="#0E7490" stroke-width="3"/>
  <text x="44" y="68" font-size="28" font-weight="700" fill="#0E7490">process A</text>
  <text x="44" y="118" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">fd 3</text>
  <text x="44" y="160" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">fd 4</text>
  <rect x="20" y="320" width="300" height="160" rx="14" fill="#DFF4F8" stroke="#0E7490" stroke-width="3"/>
  <text x="44" y="368" font-size="28" font-weight="700" fill="#0E7490">child (fork)</text>
  <text x="44" y="418" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">fd 3</text>

  <!-- syscall boundary -->
  <line x1="350" y1="10" x2="350" y2="630" stroke="#1F4FA8" stroke-width="4" stroke-dasharray="16 12"/>
  <rect x="356" y="586" width="96" height="34" fill="#FFFFFF"/>
  <text x="362" y="612" font-size="24" font-weight="700" fill="#1F4FA8">syscall</text>

  <!-- struct file x2 -->
  <rect x="400" y="40" width="330" height="170" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="424" y="86" font-size="28" font-weight="700" fill="#B45309">struct file #1</text>
  <text x="424" y="130" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">f_pos = 10</text>
  <text x="424" y="172" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">f_op  = ext4</text>
  <rect x="400" y="300" width="330" height="130" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="424" y="346" font-size="28" font-weight="700" fill="#B45309">struct file #2</text>
  <text x="424" y="390" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">f_pos = 0</text>

  <!-- dentry -->
  <rect x="800" y="40" width="330" height="170" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="824" y="86" font-size="28" font-weight="700" fill="#B45309">dentry</text>
  <text x="824" y="130" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">"hostname"</text>
  <text x="824" y="172" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">d_parent: etc</text>

  <!-- inode -->
  <rect x="800" y="300" width="330" height="130" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="824" y="346" font-size="28" font-weight="700" fill="#B45309">inode</text>
  <text x="824" y="390" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">i_ino, i_size</text>

  <!-- page cache (data) -->
  <rect x="800" y="490" width="330" height="120" rx="14" fill="#DCF3EA" stroke="#047857" stroke-width="3"/>
  <text x="824" y="536" font-size="28" font-weight="700" fill="#047857">address_space</text>
  <text x="824" y="580" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">folios (cache)</text>

  <!-- superblock -->
  <rect x="1200" y="300" width="420" height="130" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="1224" y="346" font-size="28" font-weight="700" fill="#B45309">super_block</text>
  <text x="1224" y="390" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">ext4 on /dev/sda2</text>
  <!-- disk -->
  <rect x="1200" y="490" width="420" height="120" rx="14" fill="#EEE6FB" stroke="#6D28D9" stroke-width="3"/>
  <text x="1224" y="560" font-size="28" font-weight="700" fill="#6D28D9">block device</text>

  <!-- arrows -->
  <path d="M 230 108 L 395 108" class="arrow" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 230 410 C 330 410 330 160 395 150" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 250 150 C 330 160 330 360 395 360" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 730 125 L 795 125" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 730 365 L 795 160" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 965 210 L 965 295" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 965 430 L 965 485" stroke="#3B4868" stroke-width="4" fill="none" stroke-dasharray="12 10" marker-end="url(#ah)"/>
  <path d="M 1130 365 L 1195 365" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 1410 430 L 1410 485" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>

  <!-- callouts -->
  <circle cx="380" cy="250" r="22" fill="#1F4FA8"/><text x="380" y="259" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="765" cy="250" r="22" fill="#1F4FA8"/><text x="765" y="259" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="1165" cy="260" r="22" fill="#1F4FA8"/><text x="1165" y="269" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
</svg>
