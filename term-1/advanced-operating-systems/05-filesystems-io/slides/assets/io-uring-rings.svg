<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 620" font-family="Inter, Vazirmatn, sans-serif" direction="ltr">
  <!-- Roles (Advanced OS): user=teal, kernel=amber, hardware=violet, data=green -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4868"/>
    </marker>
  </defs>
  <!-- user -->
  <rect x="20" y="40" width="1600" height="130" rx="14" fill="#DFF4F8" stroke="#0E7490" stroke-width="3"/>
  <text x="44" y="96" font-size="28" font-weight="700" fill="#0E7490">user space</text>
  <text x="44" y="142" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">fill SQE · bump SQ tail</text>
  <text x="1040" y="142" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">read CQE · bump CQ head</text>

  <!-- shared rings -->
  <rect x="20" y="215" width="1600" height="150" rx="14" fill="#DCF3EA" stroke="#047857" stroke-width="3"/>
  <text x="44" y="258" font-size="26" font-weight="700" fill="#047857">shared memory (mmap)</text>
  <g font-family="JetBrains Mono, monospace" font-size="24" fill="#0A1633">
    <rect x="60" y="280" width="90" height="64" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="3"/><text x="72" y="321">SQE</text>
    <rect x="160" y="280" width="90" height="64" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="3"/><text x="172" y="321">SQE</text>
    <rect x="260" y="280" width="90" height="64" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="3"/><text x="272" y="321">SQE</text>
    <rect x="360" y="280" width="90" height="64" rx="8" fill="#FFFFFF" stroke="#8C9DBF" stroke-width="3"/>
    <text x="470" y="321" font-family="Inter, sans-serif" font-weight="700" fill="#047857">SQ</text>
    <rect x="1040" y="280" width="90" height="64" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="3"/><text x="1052" y="321">CQE</text>
    <rect x="1140" y="280" width="90" height="64" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="3"/><text x="1152" y="321">CQE</text>
    <rect x="1240" y="280" width="90" height="64" rx="8" fill="#FFFFFF" stroke="#8C9DBF" stroke-width="3"/>
    <text x="1350" y="321" font-family="Inter, sans-serif" font-weight="700" fill="#047857">CQ</text>
  </g>

  <!-- boundary -->
  <line x1="20" y1="395" x2="1620" y2="395" stroke="#1F4FA8" stroke-width="4" stroke-dasharray="16 12"/>
  <rect x="1300" y="380" width="300" height="30" fill="#FFFFFF"/>
  <text x="1312" y="404" font-size="24" font-weight="700" fill="#1F4FA8">io_uring_enter()</text>

  <!-- kernel -->
  <rect x="20" y="430" width="470" height="160" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="44" y="478" font-size="28" font-weight="700" fill="#B45309">io_submit_sqes</text>
  <text x="44" y="522" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">io_issue_sqe</text>
  <text x="44" y="562" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">NOWAIT ->read_iter</text>
  <rect x="580" y="430" width="400" height="160" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="604" y="478" font-size="28" font-weight="700" fill="#B45309">would block?</text>
  <text x="604" y="522" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">poll · async RA</text>
  <text x="604" y="562" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">io-wq worker</text>
  <rect x="1070" y="430" width="550" height="160" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="1094" y="478" font-size="28" font-weight="700" fill="#B45309">post CQE</text>
  <text x="1094" y="522" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">user_data, res</text>

  <path d="M 255 170 L 255 275" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 255 345 L 255 425" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 490 510 L 575 510" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 980 510 L 1065 510" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 1185 425 L 1185 350" stroke="#3B4868" stroke-width="4" fill="none" stroke-dasharray="12 10" marker-end="url(#ah)"/>
  <path d="M 1185 275 L 1185 175" stroke="#3B4868" stroke-width="4" fill="none" stroke-dasharray="12 10" marker-end="url(#ah)"/>
  <path d="M 380 590 C 600 615 900 615 1100 590" stroke="#F5B301" stroke-width="8" fill="none" marker-end="url(#ah)"/>

  <circle cx="300" cy="225" r="22" fill="#1F4FA8"/><text x="300" y="234" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="530" cy="460" r="22" fill="#1F4FA8"/><text x="530" y="469" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="1230" cy="225" r="22" fill="#1F4FA8"/><text x="1230" y="234" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
</svg>
