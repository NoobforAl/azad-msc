<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" font-family="Inter, Vazirmatn, sans-serif" direction="ltr">
  <!-- Roles (Advanced OS): user=teal #0E7490, kernel=amber #B45309, hardware=violet #6D28D9, data=green #047857 -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4868"/>
    </marker>
  </defs>

  <!-- user space band -->
  <rect x="20" y="20" width="1560" height="110" rx="14" fill="#DFF4F8" stroke="#0E7490" stroke-width="3"/>
  <text x="50" y="64" font-size="28" font-weight="700" fill="#0E7490">user space</text>
  <text x="50" y="106" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">process A: getpid() = 1200</text>
  <text x="1010" y="106" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">process B: 1300</text>

  <!-- syscall boundary -->
  <line x1="20" y1="158" x2="1580" y2="158" stroke="#1F4FA8" stroke-width="4" stroke-dasharray="16 12"/>
  <rect x="1300" y="144" width="260" height="30" fill="#FFFFFF"/>
  <text x="1312" y="168" font-size="24" font-weight="700" fill="#1F4FA8">syscall boundary</text>

  <!-- tasks (kernel) -->
  <rect x="40" y="190" width="400" height="150" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="64" y="236" font-size="28" font-weight="700" fill="#B45309">task_struct</text>
  <text x="64" y="278" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">pid 1200 tgid 1200</text>
  <text x="64" y="318" font-size="26" font-family="JetBrains Mono, monospace" fill="#3B4868">se · stack · regs</text>

  <rect x="500" y="190" width="400" height="150" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="524" y="236" font-size="28" font-weight="700" fill="#B45309">task_struct</text>
  <text x="524" y="278" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">pid 1201 tgid 1200</text>
  <text x="524" y="318" font-size="26" font-family="JetBrains Mono, monospace" fill="#3B4868">se · stack · regs</text>

  <rect x="1010" y="190" width="400" height="150" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="1034" y="236" font-size="28" font-weight="700" fill="#B45309">task_struct</text>
  <text x="1034" y="278" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">pid 1300 tgid 1300</text>
  <text x="1034" y="318" font-size="26" font-family="JetBrains Mono, monospace" fill="#3B4868">se · stack · regs</text>

  <!-- shared resources (data) -->
  <rect x="40" y="440" width="270" height="90" rx="14" fill="#DCF3EA" stroke="#047857" stroke-width="3"/>
  <text x="66" y="496" font-size="28" font-weight="700" font-family="JetBrains Mono, monospace" fill="#047857">mm_struct</text>
  <rect x="340" y="440" width="270" height="90" rx="14" fill="#DCF3EA" stroke="#047857" stroke-width="3"/>
  <text x="366" y="496" font-size="28" font-weight="700" font-family="JetBrains Mono, monospace" fill="#047857">files</text>
  <rect x="640" y="440" width="270" height="90" rx="14" fill="#DCF3EA" stroke="#047857" stroke-width="3"/>
  <text x="666" y="496" font-size="28" font-weight="700" font-family="JetBrains Mono, monospace" fill="#047857">signal</text>

  <rect x="1010" y="440" width="190" height="90" rx="14" fill="#DCF3EA" stroke="#047857" stroke-width="3"/>
  <text x="1030" y="496" font-size="28" font-weight="700" font-family="JetBrains Mono, monospace" fill="#047857">mm</text>
  <rect x="1220" y="440" width="190" height="90" rx="14" fill="#DCF3EA" stroke="#047857" stroke-width="3"/>
  <text x="1240" y="496" font-size="28" font-weight="700" font-family="JetBrains Mono, monospace" fill="#047857">files</text>

  <!-- pointers -->
  <path d="M175 340 L175 432" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M240 340 L470 432" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M300 340 L760 432" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M600 340 L200 432" stroke="#F5B301" stroke-width="6" fill="none" marker-end="url(#ah)"/>
  <path d="M700 340 L490 432" stroke="#F5B301" stroke-width="6" fill="none" marker-end="url(#ah)"/>
  <path d="M780 340 L780 432" stroke="#F5B301" stroke-width="6" fill="none" marker-end="url(#ah)"/>
  <path d="M1105 340 L1105 432" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M1300 340 L1315 432" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>

</svg>
