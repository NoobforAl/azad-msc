<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 40 1500 570" font-family="Inter, Vazirmatn, sans-serif" direction="ltr">
  <!-- EEVDF pick: virtual-time axis, average V, three tasks with vruntime (dot) and virtual deadline (bar end). -->
  <style>
    .ax { stroke:#3B4868; stroke-width:4; }
    .v  { stroke:#1F4FA8; stroke-width:5; stroke-dasharray:16 12; }
    .lb { font-size:34px; font-weight:700; }
    .mo { font-size:32px; font-family:'JetBrains Mono', monospace; fill:#0A1633; }
  </style>
  <!-- axis -->
  <line x1="120" y1="540" x2="1540" y2="540" class="ax"/>
  <text x="1380" y="580" class="mo">virtual time →</text>
  <!-- V line -->
  <line x1="700" y1="60" x2="700" y2="540" class="v"/>
  <text x="712" y="90" font-size="38" font-weight="800" fill="#1F4FA8">V</text>
  <text x="712" y="124" class="mo">weighted avg vruntime</text>
  <!-- eligible zone -->
  <rect x="120" y="150" width="580" height="370" rx="14" fill="#DCF3EA" opacity="0.55"/>
  <text x="140" y="190" class="lb" fill="#047857">lag ≥ 0 · eligible</text>
  <text x="900" y="190" class="lb" fill="#B4123A">lag &lt; 0</text>

  <!-- task A: v=520 deadline 520+380 -->
  <line x1="520" y1="270" x2="900" y2="270" stroke="#0E7490" stroke-width="18" stroke-linecap="round"/>
  <circle cx="520" cy="270" r="16" fill="#0E7490"/>
  <text x="140" y="280" class="lb" fill="#0E7490">A</text>
  <text x="920" y="280" class="mo">vd = v + 2.8 ms·1024/w</text>

  <!-- task B: v=640, short slice: deadline 640+90 (current pick) -->
  <line x1="640" y1="370" x2="730" y2="370" stroke="#F5B301" stroke-width="18" stroke-linecap="round"/>
  <circle cx="640" cy="370" r="16" fill="#B45309"/>
  <text x="140" y="380" class="lb" fill="#B45309">B ← pick</text>
  <text x="760" y="380" class="mo">short slice → earliest vd</text>

  <!-- task C: v=860 not eligible, deadline 860+380 -->
  <line x1="860" y1="470" x2="1240" y2="470" stroke="#6D28D9" stroke-width="18" stroke-linecap="round" opacity="0.6"/>
  <circle cx="860" cy="470" r="16" fill="#6D28D9"/>
  <text x="140" y="480" class="lb" fill="#6D28D9">C</text>
  <text x="1260" y="480" class="mo">not eligible</text>
</svg>
