<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" font-family="Inter, Vazirmatn, sans-serif" direction="ltr">
  <!-- Roles (Advanced OS): user=teal #0E7490, kernel=amber #B45309, hardware=violet #6D28D9, data=green #047857 -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4868"/>
    </marker>
  </defs>

  <!-- sources -->
  <rect x="30" y="40" width="360" height="110" rx="14" fill="#DFF4F8" stroke="#0E7490" stroke-width="3"/>
  <text x="56" y="88" font-size="28" font-weight="700" fill="#0E7490">① syscall</text>
  <text x="56" y="130" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">requested</text>

  <rect x="30" y="230" width="360" height="110" rx="14" fill="#DFF4F8" stroke="#0E7490" stroke-width="3"/>
  <text x="56" y="278" font-size="28" font-weight="700" fill="#0E7490">② exception</text>
  <text x="56" y="320" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">#PF 14 · #GP 13 · #BP 3</text>

  <rect x="30" y="420" width="360" height="110" rx="14" fill="#EEE6FB" stroke="#6D28D9" stroke-width="3"/>
  <text x="56" y="468" font-size="28" font-weight="700" fill="#6D28D9">③ interrupt</text>
  <text x="56" y="510" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">device · timer · IPI</text>

  <!-- APIC -->
  <rect x="470" y="420" width="200" height="110" rx="14" fill="#EEE6FB" stroke="#6D28D9" stroke-width="3"/>
  <text x="510" y="485" font-size="28" font-weight="700" fill="#6D28D9">APIC</text>

  <!-- MSR / IDT -->
  <rect x="750" y="40" width="300" height="110" rx="14" fill="#EEE6FB" stroke="#6D28D9" stroke-width="3"/>
  <text x="776" y="88" font-size="28" font-weight="700" fill="#6D28D9">MSR_LSTAR</text>
  <text x="776" y="130" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">no IDT</text>

  <rect x="750" y="230" width="300" height="300" rx="14" fill="#EEE6FB" stroke="#6D28D9" stroke-width="3"/>
  <text x="776" y="280" font-size="28" font-weight="700" fill="#6D28D9">IDT</text>
  <text x="776" y="325" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">0–31  exceptions</text>
  <text x="776" y="365" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">32–255 IRQ, IPI</text>
  <text x="776" y="405" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">gate: DPL, IST</text>

  <!-- ring boundary vertical -->
  <line x1="1100" y1="20" x2="1100" y2="550" stroke="#1F4FA8" stroke-width="4" stroke-dasharray="16 12"/>
  <rect x="1080" y="172" width="150" height="40" fill="#FFFFFF"/>
  <text x="1090" y="200" font-size="24" font-weight="700" fill="#1F4FA8">→ Ring 0</text>

  <!-- kernel handlers -->
  <rect x="1150" y="40" width="420" height="110" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="1176" y="105" font-size="24" font-family="JetBrains Mono, monospace" fill="#B45309">entry_SYSCALL_64</text>

  <rect x="1150" y="230" width="420" height="110" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="1176" y="278" font-size="24" font-family="JetBrains Mono, monospace" fill="#B45309">asm_exc_* → exc_*()</text>
  <text x="1176" y="320" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">traps.c · fault.c</text>

  <rect x="1150" y="420" width="420" height="110" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="1176" y="468" font-size="24" font-family="JetBrains Mono, monospace" fill="#B45309">common_interrupt()</text>
  <text x="1176" y="510" font-size="24" font-family="JetBrains Mono, monospace" fill="#0A1633">→ handle_irq_event()</text>

  <!-- arrows -->
  <path d="M390 95 L742 95" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M1050 95 L1142 95" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M390 285 L742 285" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M390 475 L462 475" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M670 475 L742 475" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M1050 285 L1142 285" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M1050 475 L1142 475" stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <text x="470" y="270" font-size="22" fill="#3B4868">synchronous</text>
  <text x="410" y="400" font-size="22" fill="#3B4868">asynchronous</text>
</svg>
