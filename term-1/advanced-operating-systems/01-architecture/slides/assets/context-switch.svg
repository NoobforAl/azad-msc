<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" font-family="Inter, Vazirmatn, sans-serif" direction="ltr">
  <!-- Roles (Advanced OS): user=teal #0E7490, kernel=amber #B45309, hardware=violet #6D28D9, data=green #047857 -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4868"/>
    </marker>
  </defs>

  <!-- Task A kernel stack -->
  <text x="40" y="50" font-size="32" font-weight="750" fill="#0A1633">task A · kernel stack</text>
  <rect x="40" y="80" width="460" height="90" rx="14" fill="#DCF3EA" stroke="#047857" stroke-width="3"/>
  <text x="66" y="135" font-size="26" font-family="JetBrains Mono, monospace" fill="#047857">pt_regs (user regs)</text>
  <rect x="40" y="185" width="460" height="80" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="66" y="235" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">... context_switch()</text>
  <rect x="40" y="280" width="460" height="80" rx="14" fill="#FFF1C2" stroke="#F5B301" stroke-width="4"/>
  <text x="66" y="330" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">rbp rbx r12–r15</text>
  <text x="66" y="410" font-size="26" font-family="JetBrains Mono, monospace" fill="#3B4868">A-&gt;thread.sp ↑</text>

  <!-- Task B kernel stack -->
  <text x="1100" y="50" font-size="32" font-weight="750" fill="#0A1633">task B · kernel stack</text>
  <rect x="1100" y="80" width="460" height="90" rx="14" fill="#DCF3EA" stroke="#047857" stroke-width="3"/>
  <text x="1126" y="135" font-size="26" font-family="JetBrains Mono, monospace" fill="#047857">pt_regs (user regs)</text>
  <rect x="1100" y="185" width="460" height="80" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
  <text x="1126" y="235" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">... context_switch()</text>
  <rect x="1100" y="280" width="460" height="80" rx="14" fill="#FFF1C2" stroke="#F5B301" stroke-width="4"/>
  <text x="1126" y="330" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">rbp rbx r12–r15</text>
  <text x="1126" y="410" font-size="26" font-family="JetBrains Mono, monospace" fill="#3B4868">B-&gt;thread.sp ↑</text>

  <!-- CPU in the middle -->
  <rect x="590" y="150" width="420" height="250" rx="14" fill="#EEE6FB" stroke="#6D28D9" stroke-width="3"/>
  <text x="620" y="200" font-size="28" font-weight="700" fill="#6D28D9">CPU</text>
  <text x="620" y="250" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">rsp</text>
  <text x="620" y="300" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">CR3 → mm</text>
  <text x="620" y="350" font-size="26" font-family="JetBrains Mono, monospace" fill="#0A1633">current_task</text>

  <!-- arrows -->
  <path d="M500 320 C550 320, 560 250, 600 250" stroke="#3B4868" stroke-width="4" fill="none" stroke-dasharray="12 10" marker-start="url(#ah)"/>
  <text x="430" y="470" font-size="24" fill="#3B4868">① push 6, save rsp</text>
  <path d="M700 250 C850 250, 1000 320, 1092 320" stroke="#F5B301" stroke-width="8" fill="none" marker-end="url(#ah)"/>
  <text x="900" y="470" font-size="24" fill="#3B4868">② rsp = B-&gt;thread.sp, pop 6</text>

  <!-- bottom band -->
  <rect x="40" y="520" width="1520" height="90" rx="14" fill="#E6EEFC" stroke="#1F4FA8" stroke-width="3"/>
  <text x="70" y="578" font-size="28" font-weight="700" fill="#123A86">③ __switch_to(): FPU · FS/GS · current_task = B · top_of_stack = B</text>
</svg>
