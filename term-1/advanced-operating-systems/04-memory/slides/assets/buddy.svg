<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" font-family="Inter, Vazirmatn, sans-serif" direction="ltr">
  <!-- Roles (Advanced OS): data/memory = green #047857, kernel = amber #B45309 -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4868"/>
    </marker>
  </defs>
  <g font-family="JetBrains Mono, monospace" font-size="26">
    <!-- order 4 -->
    <text x="20" y="62" fill="#3B4868">order 4</text>
    <rect x="200" y="20" width="1380" height="70" rx="14" fill="#DCF3EA" stroke="#047857" stroke-width="3"/>
    <text x="890" y="64" text-anchor="middle" fill="#0A1633">pfn 0x1000 – 0x100f  (16 pages)</text>

    <!-- order 3 -->
    <text x="20" y="182" fill="#3B4868">order 3</text>
    <rect x="200" y="140" width="680" height="70" rx="14" fill="#FFFFFF" stroke="#047857" stroke-width="3"/>
    <text x="540" y="184" text-anchor="middle" fill="#0A1633">0x1000 – 0x1007</text>
    <rect x="900" y="140" width="680" height="70" rx="14" fill="#F4F7FC" stroke="#8C9DBF" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="1240" y="184" text-anchor="middle" fill="#3B4868">0x1008 – 0x100f → free_area[3]</text>

    <!-- order 2 -->
    <text x="20" y="302" fill="#3B4868">order 2</text>
    <rect x="200" y="260" width="330" height="70" rx="14" fill="#FDEFD9" stroke="#B45309" stroke-width="3"/>
    <text x="365" y="304" text-anchor="middle" fill="#B45309">0x1000 alloc</text>
    <rect x="550" y="260" width="330" height="70" rx="14" fill="#F4F7FC" stroke="#8C9DBF" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="715" y="304" text-anchor="middle" fill="#3B4868">0x1004 free[2]</text>
  </g>

  <g stroke="#3B4868" stroke-width="4" fill="none" marker-end="url(#ah)">
    <path d="M540 90 L540 132"/>
    <path d="M1240 90 L1240 132"/>
    <path d="M365 210 L365 252"/>
    <path d="M715 210 L715 252"/>
  </g>

  <!-- formula -->
  <rect x="200" y="380" width="1380" height="150" rx="14" fill="#E6EEFC" stroke="#1F4FA8" stroke-width="3"/>
  <text x="230" y="428" font-size="28" font-weight="700" fill="#123A86">free(0x1000, order 2)</text>
  <g font-family="JetBrains Mono, monospace" font-size="26" fill="#0A1633">
    <text x="230" y="470">buddy = 0x1000 ^ (1&lt;&lt;2) = 0x1004  free → merge, order 3</text>
    <text x="230" y="508">buddy = 0x1000 ^ (1&lt;&lt;3) = 0x1008  free → merge, order 4</text>
  </g>
</svg>
